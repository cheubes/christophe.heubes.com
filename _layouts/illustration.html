<!doctype html>
<html lang="{{ page.lang | default: 'fr' }}">

{% include head.html %}

<body>

  <div class="page-wrapper">

    {% include sidebar.html lang_pages=site.illustrations %}

    <div class="content-wrapper">
      <main id="illustration-detail">

        <nav class="ill-breadcrumb">
          {% if page.lang == 'en' %}
          <a href="/en/illustrations/">← Thought Figures</a>
          {% else %}
          <a href="/illustrations/">← Figures de pensée</a>
          {% endif %}
        </nav>

        <h1 class="ill-title">{{ page.title }}</h1>

        <div class="ill-svg-wrapper">
          <img src="/assets/illustrations/{{ page.slug }}{% if page.lang == 'en' %}-en{% endif %}.svg"
               alt="{{ page.title }} : {{ page.tagline }}"
               class="ill-svg-img" width="100%" loading="eager"/>
        </div>

        <div class="ill-content">
          {{ content }}
        </div>

      </main>
    </div>

  </div>

  {% include footer.html lang_pages=site.illustrations %}

{% include scripts.html %}
</body>

</html>
