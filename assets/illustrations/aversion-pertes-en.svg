<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Loss Aversion</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Cognitive bias described by Kahneman and Tversky: a loss has an emotional impact roughly 2× greater than an equivalent gain.</dc:description>
    <dc:subject>Cognitive biases, heuristics, behavioral economics, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- ── Header ── -->
  <text x="60" y="60"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="26" letter-spacing="3"
        fill="#8A9BB0">BIASES &amp; HEURISTICS</text>
  <line x1="60" y1="82" x2="1140" y2="82"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <!-- ── Graph ── -->

  <!-- Axes -->
  <line x1="165" y1="540" x2="1035" y2="540"
        stroke="#8A9BB0" stroke-width="2" opacity="0.55"/>
  <polygon points="1035,533 1035,547 1052,540"
           fill="#8A9BB0" opacity="0.55"/>

  <line x1="600" y1="820" x2="600" y2="235"
        stroke="#8A9BB0" stroke-width="2" opacity="0.55"/>
  <polygon points="593,235 607,235 600,218"
           fill="#8A9BB0" opacity="0.55"/>

  <!-- Axis labels -->
  <text x="182" y="526" text-anchor="start"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="600" font-size="19" letter-spacing="1.5"
        fill="#8A9BB0" opacity="0.80">← LOSSES</text>
  <text x="1018" y="526" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="600" font-size="19" letter-spacing="1.5"
        fill="#C9A84C" opacity="0.90">GAINS →</text>

  <text x="616" y="242" text-anchor="start"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="17" letter-spacing="1"
        fill="#8A9BB0" opacity="0.65">VALUE ↑</text>
  <text x="616" y="820" text-anchor="start"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="17" letter-spacing="1"
        fill="#8A9BB0" opacity="0.65">PAIN ↓</text>

  <!-- Value function curve (asymmetric S-curve) -->
  <path d="M 175,795 C 300,720 460,620 600,540 C 720,460 870,400 1040,360"
        fill="none" stroke="#C9A84C" stroke-width="3.5" opacity="0.88"/>

  <!-- Reference dashed lines — gain side -->
  <line x1="600" y1="540" x2="774" y2="540"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45" stroke-dasharray="5 5"/>
  <line x1="774" y1="540" x2="774" y2="425"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45" stroke-dasharray="5 5"/>

  <!-- Gain annotation -->
  <text x="788" y="488" text-anchor="start"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="22"
        fill="#C9A84C" opacity="0.90">+ 115</text>
  <text x="788" y="510" text-anchor="start"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="16" letter-spacing="1"
        fill="#C9A84C" opacity="0.72">pts of pleasure</text>

  <!-- Reference dashed lines — loss side -->
  <line x1="600" y1="540" x2="426" y2="540"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45" stroke-dasharray="5 5"/>
  <line x1="426" y1="540" x2="426" y2="745"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45" stroke-dasharray="5 5"/>

  <!-- Loss annotation -->
  <text x="412" y="648" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="22"
        fill="#8A9BB0" opacity="0.88">− 205</text>
  <text x="412" y="670" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="16" letter-spacing="1"
        fill="#8A9BB0" opacity="0.72">pts of pain</text>

  <!-- Horizontal comparison line -->
  <line x1="426" y1="540" x2="774" y2="540"
        stroke="#8A9BB0" stroke-width="1" opacity="0.22"/>

  <!-- Origin dot -->
  <circle cx="600" cy="540" r="6" fill="#8A9BB0" opacity="0.65"/>

  <!-- Ratio -->
  <text x="600" y="868" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="30"
        fill="#8A9BB0" opacity="0.82">× 2.25</text>
  <text x="600" y="900" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="17" letter-spacing="1.5"
        fill="#8A9BB0" opacity="0.65">the impact of a loss vs an equivalent gain</text>

  <!-- ── Footer ── -->
  <line x1="60" y1="990" x2="1140" y2="990"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <text x="60" y="1062"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="58"
        fill="#C9A84C">Loss Aversion</text>

  <text x="60" y="1118"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="29"
        fill="#F0EDE4">Losing £100 hurts more than gaining £100 feels good.</text>

  <text x="60" y="1174"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1174" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
