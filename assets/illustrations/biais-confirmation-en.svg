<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Confirmation Bias</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>The tendency to search for, interpret, and recall information in a way that confirms one's pre-existing beliefs, while ignoring contradicting evidence.</dc:description>
    <dc:subject>Cognitive biases, heuristics, epistemology, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- ── Header ── -->
  <text x="60" y="60"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="26" letter-spacing="3"
        fill="#8A9BB0">BIASES &amp; HEURISTICS</text>
  <line x1="60" y1="82" x2="1140" y2="82"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <!-- ── Funnel (trapezoid) ── -->
  <polygon points="165,245 1035,245 780,720 420,720"
           fill="#8A9BB0" fill-opacity="0.06" stroke="none"/>
  <!-- Left side -->
  <line x1="165" y1="245" x2="420" y2="720"
        stroke="#8A9BB0" stroke-width="2" opacity="0.50"/>
  <!-- Right side -->
  <line x1="1035" y1="245" x2="780" y2="720"
        stroke="#8A9BB0" stroke-width="2" opacity="0.50"/>
  <!-- Top edge -->
  <line x1="165" y1="245" x2="1035" y2="245"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.40"/>
  <!-- Bottom edge -->
  <line x1="420" y1="720" x2="780" y2="720"
        stroke="#C9A84C" stroke-width="2" opacity="0.65"/>

  <!-- ── Top row label ── -->
  <text x="600" y="158" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="20" letter-spacing="2"
        fill="#8A9BB0" opacity="0.75">INCOMING INFORMATION</text>

  <!-- ── Top row: 8 circles (gold = confirming, gray = contradicting) ── -->
  <!-- Gold -->
  <circle cx="210" cy="195" r="18"
          fill="#C9A84C" fill-opacity="0.60" stroke="#C9A84C" stroke-width="2" opacity="0.85"/>
  <circle cx="470" cy="195" r="18"
          fill="#C9A84C" fill-opacity="0.60" stroke="#C9A84C" stroke-width="2" opacity="0.85"/>
  <circle cx="730" cy="195" r="18"
          fill="#C9A84C" fill-opacity="0.60" stroke="#C9A84C" stroke-width="2" opacity="0.85"/>
  <circle cx="940" cy="195" r="18"
          fill="#C9A84C" fill-opacity="0.60" stroke="#C9A84C" stroke-width="2" opacity="0.85"/>
  <!-- Gray -->
  <circle cx="340" cy="195" r="18"
          fill="#8A9BB0" fill-opacity="0.15" stroke="#8A9BB0" stroke-width="2" opacity="0.60"/>
  <circle cx="600" cy="195" r="18"
          fill="#8A9BB0" fill-opacity="0.15" stroke="#8A9BB0" stroke-width="2" opacity="0.60"/>
  <circle cx="860" cy="195" r="18"
          fill="#8A9BB0" fill-opacity="0.15" stroke="#8A9BB0" stroke-width="2" opacity="0.60"/>
  <circle cx="1000" cy="195" r="18"
          fill="#8A9BB0" fill-opacity="0.15" stroke="#8A9BB0" stroke-width="2" opacity="0.60"/>

  <!-- ── Rejected circles (gray info falling off the funnel sides) ── -->
  <!-- Left side rejects -->
  <circle cx="255" cy="415" r="17"
          fill="#8A9BB0" fill-opacity="0.08" stroke="#8A9BB0" stroke-width="1.5" opacity="0.50"/>
  <line x1="243" y1="403" x2="267" y2="427"
        stroke="#8A9BB0" stroke-width="3" opacity="0.68"/>
  <line x1="267" y1="403" x2="243" y2="427"
        stroke="#8A9BB0" stroke-width="3" opacity="0.68"/>

  <circle cx="310" cy="525" r="17"
          fill="#8A9BB0" fill-opacity="0.08" stroke="#8A9BB0" stroke-width="1.5" opacity="0.50"/>
  <line x1="298" y1="513" x2="322" y2="537"
        stroke="#8A9BB0" stroke-width="3" opacity="0.68"/>
  <line x1="322" y1="513" x2="298" y2="537"
        stroke="#8A9BB0" stroke-width="3" opacity="0.68"/>

  <!-- Right side rejects -->
  <circle cx="940" cy="415" r="17"
          fill="#8A9BB0" fill-opacity="0.08" stroke="#8A9BB0" stroke-width="1.5" opacity="0.50"/>
  <line x1="928" y1="403" x2="952" y2="427"
        stroke="#8A9BB0" stroke-width="3" opacity="0.68"/>
  <line x1="952" y1="403" x2="928" y2="427"
        stroke="#8A9BB0" stroke-width="3" opacity="0.68"/>

  <circle cx="884" cy="525" r="17"
          fill="#8A9BB0" fill-opacity="0.08" stroke="#8A9BB0" stroke-width="1.5" opacity="0.50"/>
  <line x1="872" y1="513" x2="896" y2="537"
        stroke="#8A9BB0" stroke-width="3" opacity="0.68"/>
  <line x1="896" y1="513" x2="872" y2="537"
        stroke="#8A9BB0" stroke-width="3" opacity="0.68"/>

  <!-- ── Middle row: 4 gold circles (filtered) ── -->
  <circle cx="500" cy="580" r="18"
          fill="#C9A84C" fill-opacity="0.55" stroke="#C9A84C" stroke-width="2" opacity="0.80"/>
  <circle cx="570" cy="580" r="18"
          fill="#C9A84C" fill-opacity="0.55" stroke="#C9A84C" stroke-width="2" opacity="0.80"/>
  <circle cx="640" cy="580" r="18"
          fill="#C9A84C" fill-opacity="0.55" stroke="#C9A84C" stroke-width="2" opacity="0.80"/>
  <circle cx="710" cy="580" r="18"
          fill="#C9A84C" fill-opacity="0.55" stroke="#C9A84C" stroke-width="2" opacity="0.80"/>

  <!-- ── Bottom row: 4 gold circles (retained) ── -->
  <circle cx="510" cy="790" r="18"
          fill="#C9A84C" fill-opacity="0.72" stroke="#C9A84C" stroke-width="2" opacity="0.90"/>
  <circle cx="580" cy="790" r="18"
          fill="#C9A84C" fill-opacity="0.72" stroke="#C9A84C" stroke-width="2" opacity="0.90"/>
  <circle cx="650" cy="790" r="18"
          fill="#C9A84C" fill-opacity="0.72" stroke="#C9A84C" stroke-width="2" opacity="0.90"/>
  <circle cx="720" cy="790" r="18"
          fill="#C9A84C" fill-opacity="0.72" stroke="#C9A84C" stroke-width="2" opacity="0.90"/>

  <!-- ── Bottom row label ── -->
  <text x="600" y="852" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="600" font-size="20" letter-spacing="2"
        fill="#C9A84C" opacity="0.85">WHAT WE RETAIN</text>

  <!-- ── Footer ── -->
  <line x1="60" y1="990" x2="1140" y2="990"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <text x="60" y="1062"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="58"
        fill="#C9A84C">Confirmation Bias</text>

  <text x="60" y="1118"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="29"
        fill="#F0EDE4">We seek what confirms. We ignore what contradicts.</text>

  <text x="60" y="1174"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1174" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
