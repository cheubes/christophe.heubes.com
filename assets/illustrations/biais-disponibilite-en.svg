<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Availability Bias</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Heuristic described by Kahneman and Tversky: we judge the likelihood of an event by how easily examples come to mind.</dc:description>
    <dc:subject>Cognitive biases, heuristics, epistemology, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- ── Header ── -->
  <text x="60" y="60"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="26" letter-spacing="3"
        fill="#8A9BB0">BIASES &amp; HEURISTICS</text>
  <line x1="60" y1="82" x2="1140" y2="82"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <!-- ── Chart ── -->

  <!-- Column header -->
  <text x="260" y="240" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="22" letter-spacing="2"
        fill="#8A9BB0" opacity="0.75">EXAMPLE</text>

  <!-- Legend -->
  <rect x="460" y="216" width="20" height="16" rx="2"
        fill="#C9A84C" fill-opacity="0.40" stroke="#C9A84C" opacity="0.80"/>
  <text x="488" y="231" text-anchor="start"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="20"
        fill="#C9A84C" opacity="0.85">PERCEIVED RISK</text>

  <rect x="700" y="216" width="20" height="16" rx="2"
        fill="#8A9BB0" fill-opacity="0.30" stroke="#8A9BB0" opacity="0.65"/>
  <text x="728" y="231" text-anchor="start"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="20"
        fill="#8A9BB0" opacity="0.72">ACTUAL RISK</text>

  <!-- ── Row 1 : Plane crash ── -->
  <text x="444" y="332" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="#8A9BB0" opacity="0.82">Plane crash</text>
  <!-- Perceived (gold) -->
  <rect x="460" y="290" width="382" height="30" rx="4"
        fill="#C9A84C" fill-opacity="0.35" stroke="#C9A84C" stroke-width="1.5" opacity="0.78"/>
  <!-- Actual (gray) -->
  <rect x="460" y="334" width="34" height="30" rx="4"
        fill="#8A9BB0" fill-opacity="0.28" stroke="#8A9BB0" stroke-width="1.5" opacity="0.60"/>

  <!-- ── Row 2 : Shark attack ── -->
  <text x="444" y="496" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="#8A9BB0" opacity="0.82">Shark attack</text>
  <!-- Perceived (gold) -->
  <rect x="460" y="454" width="304" height="30" rx="4"
        fill="#C9A84C" fill-opacity="0.35" stroke="#C9A84C" stroke-width="1.5" opacity="0.78"/>
  <!-- Actual (gray) -->
  <rect x="460" y="498" width="5" height="30" rx="4"
        fill="#8A9BB0" fill-opacity="0.28" stroke="#8A9BB0" stroke-width="1.5" opacity="0.60"/>

  <!-- ── Row 3 : Car accident ── -->
  <text x="444" y="660" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="#8A9BB0" opacity="0.82">Car accident</text>
  <!-- Perceived (gold) -->
  <rect x="460" y="618" width="157" height="30" rx="4"
        fill="#C9A84C" fill-opacity="0.35" stroke="#C9A84C" stroke-width="1.5" opacity="0.78"/>
  <!-- Actual (gray) -->
  <rect x="460" y="662" width="441" height="30" rx="4"
        fill="#8A9BB0" fill-opacity="0.28" stroke="#8A9BB0" stroke-width="1.5" opacity="0.60"/>

  <!-- Italic note -->
  <text x="460" y="714" text-anchor="start"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="19" font-style="italic"
        fill="#8A9BB0" opacity="0.62">← car accidents are underestimated because they are less vivid</text>

  <!-- Caption -->
  <text x="600" y="862" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="22" letter-spacing="1.5"
        fill="#8A9BB0" opacity="0.68">What is memorable is not what is probable.</text>

  <!-- ── Footer ── -->
  <line x1="60" y1="990" x2="1140" y2="990"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <text x="60" y="1062"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="58"
        fill="#C9A84C">Availability Bias</text>

  <text x="60" y="1118"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="29"
        fill="#F0EDE4">We judge as probable what comes easily to mind.</text>

  <text x="60" y="1174"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1174" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
