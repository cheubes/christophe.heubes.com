<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Biais de rétrospection</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Tendance à surestimer rétrospectivement la probabilité qu'on aurait assignée à un événement une fois que son issue est connue.</dc:description>
    <dc:subject>Biais cognitifs, heuristiques, épistémologie, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- ── Header ── -->
  <text x="60" y="60"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="26" letter-spacing="3"
        fill="#8A9BB0">BIAIS &amp; HEURISTIQUES</text>
  <line x1="60" y1="82" x2="1140" y2="82"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <!-- ── Panneau AVANT ── -->
  <rect x="165" y="258" width="300" height="370" rx="12"
        fill="#8A9BB0" fill-opacity="0.05" stroke="#8A9BB0" stroke-width="1.5" opacity="0.50"
        stroke-dasharray="6 4"/>
  <text x="315" y="296" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="600" font-size="19" letter-spacing="2"
        fill="#8A9BB0" opacity="0.80">AVANT</text>
  <text x="315" y="318" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="16"
        fill="#8A9BB0" opacity="0.62">estimation initiale</text>

  <!-- Barre AVANT (~50 %) -->
  <rect x="287" y="348" width="56" height="150" rx="4"
        fill="#8A9BB0" fill-opacity="0.08" stroke="#8A9BB0" stroke-width="1" opacity="0.35"/>
  <rect x="287" y="423" width="56" height="75" rx="4"
        fill="#8A9BB0" fill-opacity="0.30" stroke="none"/>

  <text x="315" y="526" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="28"
        fill="#8A9BB0" opacity="0.68">~50 %</text>
  <text x="315" y="554" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="17"
        fill="#8A9BB0" opacity="0.62">incertain</text>
  <text x="315" y="578" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="16"
        fill="#8A9BB0" opacity="0.55">probabilité honnête</text>

  <!-- ── Panneau APRÈS ── -->
  <rect x="735" y="258" width="300" height="370" rx="12"
        fill="#C9A84C" fill-opacity="0.07" stroke="#C9A84C" stroke-width="2" opacity="0.78"/>
  <text x="885" y="296" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="600" font-size="19" letter-spacing="2"
        fill="#C9A84C" opacity="0.88">APRÈS</text>
  <text x="885" y="318" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="16"
        fill="#C9A84C" opacity="0.72">mémoire reconstruite</text>

  <!-- Barre APRÈS (~85 %) -->
  <rect x="857" y="348" width="56" height="150" rx="4"
        fill="#8A9BB0" fill-opacity="0.08" stroke="#8A9BB0" stroke-width="1" opacity="0.35"/>
  <rect x="857" y="370" width="56" height="128" rx="4"
        fill="#C9A84C" fill-opacity="0.45" stroke="none"/>

  <text x="885" y="526" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="28"
        fill="#C9A84C" opacity="0.88">~85 %</text>
  <text x="885" y="556" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="20" letter-spacing="1"
        fill="#C9A84C" opacity="0.85">« Je le savais »</text>
  <text x="885" y="582" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="16"
        fill="#C9A84C" opacity="0.68">certitude rétrospective</text>

  <!-- ── Flèche entre les panneaux ── -->
  <line x1="477" y1="425" x2="723" y2="425"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.50" stroke-dasharray="4 3"/>
  <polygon points="723,419 723,431 736,425"
           fill="#8A9BB0" opacity="0.50"/>
  <text x="600" y="413" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="16" letter-spacing="1"
        fill="#8A9BB0" opacity="0.62">réécriture mémorielle</text>

  <!-- ── Timeline ── -->
  <line x1="155" y1="693" x2="1048" y2="693"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45" stroke-dasharray="5 3"/>
  <polygon points="1048,687 1048,699 1061,693"
           fill="#8A9BB0" opacity="0.45"/>
  <!-- Marqueur événement -->
  <line x1="600" y1="673" x2="600" y2="713"
        stroke="#C9A84C" stroke-width="2.5" opacity="0.80"/>
  <text x="600" y="735" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="19" letter-spacing="2"
        fill="#C9A84C" opacity="0.88">ÉVÉNEMENT</text>

  <!-- Caption -->
  <text x="600" y="860" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="18" letter-spacing="1.5"
        fill="#8A9BB0" opacity="0.68">La mémoire se réécrit à la lumière du résultat connu.</text>

  <!-- ── Footer ── -->
  <line x1="60" y1="990" x2="1140" y2="990"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <text x="60" y="1062"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="58"
        fill="#C9A84C">Biais de rétrospection</text>

  <text x="60" y="1118"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="29"
        fill="#F0EDE4">« Je le savais depuis le début. »</text>

  <text x="60" y="1174"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1174" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
