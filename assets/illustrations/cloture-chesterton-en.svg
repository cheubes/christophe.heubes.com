<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Chesterton's Fence</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Principle formulated by G. K. Chesterton in 1929: before removing an existing rule or structure, you must understand why it was put in place.</dc:description>
    <dc:subject>Epistemology, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">EPISTEMOLOGY</text>

  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <g transform="translate(0,0)">
    <text x="600" y="340" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="120"
          fill="#C9A84C" opacity="0.45">?</text>
    <text x="600" y="262" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="19"
          letter-spacing="2.5" fill="#C9A84C" opacity="0.80">WHY IS IT THERE?</text>
    <rect x="207" y="355" width="16" height="168" rx="5"
          fill="#8A9BB0" opacity="0.55"/>
    <rect x="412" y="355" width="16" height="168" rx="5"
          fill="#8A9BB0" opacity="0.55"/>
    <rect x="617" y="355" width="16" height="168" rx="5"
          fill="#8A9BB0" opacity="0.55"/>
    <rect x="822" y="355" width="16" height="168" rx="5"
          fill="#8A9BB0" opacity="0.55"/>
    <rect x="1027" y="355" width="16" height="168" rx="5"
          fill="#8A9BB0" opacity="0.55"/>
    <rect x="215" y="388" width="820" height="14" rx="6"
          fill="#C9A84C" opacity="0.62"/>
    <rect x="215" y="450" width="820" height="14" rx="6"
          fill="#C9A84C" opacity="0.62"/>
    <line x1="600" y1="538" x2="600" y2="820"
          stroke="#8A9BB0" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.45"/>
    <line x1="238" y1="614" x2="268" y2="644"
          stroke="#8A9BB0" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
    <line x1="268" y1="614" x2="238" y2="644"
          stroke="#8A9BB0" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
    <text x="290" y="644" text-anchor="start"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17"
          letter-spacing="1" fill="#8A9BB0" opacity="0.65">REMOVE</text>
    <text x="290" y="666" text-anchor="start"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="1" fill="#8A9BB0" opacity="0.55">without understanding why</text>
    <polyline points="918,648 932,664 958,620"
              fill="none" stroke="#C9A84C" stroke-width="3.5"
              stroke-linecap="round" stroke-linejoin="round" opacity="0.78"/>
    <text x="902" y="644" text-anchor="end"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17"
          letter-spacing="1" fill="#C9A84C" opacity="0.82">UNDERSTAND</text>
    <text x="902" y="666" text-anchor="end"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="1" fill="#C9A84C" opacity="0.72">first, then decide</text>
  </g>

  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Chesterton's Fence</text>

  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">Don't remove what you don't yet understand.</text>

  <text x="60" y="1172"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1172" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
