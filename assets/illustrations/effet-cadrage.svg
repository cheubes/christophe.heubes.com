<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Effet de cadrage</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Biais cognitif par lequel la manière de présenter une information — et non son contenu — détermine la décision prise.</dc:description>
    <dc:subject>Biais &amp; Heuristiques, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">BIAIS &amp; HEURISTIQUES</text>

  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <g transform="translate(0,0)">
    <text x="600" y="215" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="20"
          letter-spacing="2" fill="#8A9BB0" opacity="0.65">MÊME DONNÉES — MÊME TRAITEMENT</text>
    <rect x="195" y="310" width="310" height="340" rx="12"
          fill="#C9A84C" fill-opacity="0.11" stroke="#C9A84C" stroke-width="1.8" opacity="0.65"/>
    <text x="350" y="400" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="88"
          fill="#C9A84C" opacity="0.85">90%</text>
    <text x="350" y="472" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="18"
          letter-spacing="2" fill="#C9A84C" opacity="0.65">DE SURVIE</text>
    <line x1="290" y1="510" x2="410" y2="510"
          stroke="#C9A84C" stroke-width="1.5" opacity="0.55"/>
    <text x="350" y="555" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="19"
          letter-spacing="1" fill="#C9A84C" opacity="0.72">OPTION CHOISIE</text>
    <text x="350" y="580" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22"
          fill="#C9A84C" opacity="0.80">72 %</text>
    <text x="350" y="600" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="16"
          letter-spacing="1" fill="#C9A84C" opacity="0.65">des sujets</text>
    <text x="600" y="494" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="42"
          fill="#8A9BB0" opacity="0.55">=</text>
    <rect x="695" y="310" width="310" height="340" rx="12"
          fill="#8A9BB0" fill-opacity="0.08" stroke="#8A9BB0" stroke-width="1.8" opacity="0.55"/>
    <text x="850" y="400" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="88"
          fill="#8A9BB0" opacity="0.65">10%</text>
    <text x="850" y="472" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="18"
          letter-spacing="2" fill="#8A9BB0" opacity="0.65">DE MORTALITÉ</text>
    <line x1="790" y1="510" x2="910" y2="510"
          stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>
    <text x="850" y="555" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="19"
          letter-spacing="1" fill="#8A9BB0" opacity="0.65">OPTION CHOISIE</text>
    <text x="850" y="580" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22"
          fill="#8A9BB0" opacity="0.55">28 %</text>
    <text x="850" y="600" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="16"
          letter-spacing="1" fill="#8A9BB0" opacity="0.55">des sujets</text>
    <text x="600" y="860" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="1.5" fill="#8A9BB0" opacity="0.65">La formulation change la décision.</text>
  </g>

  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Effet de cadrage</text>

  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">La même donnée produit des décisions opposées selon sa formulation.</text>

  <text x="60" y="1172"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1172" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
