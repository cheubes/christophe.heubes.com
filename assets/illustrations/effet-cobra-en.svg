<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Cobra Effect</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Named after a colonial India anecdote: the British offered a bounty for dead cobras to reduce their numbers. Locals started breeding cobras for profit. When the program was cancelled, captive cobras were released — and the population surged.</dc:description>
    <dc:subject>Economics &amp; Incentives, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">ECONOMICS &amp; INCENTIVES</text>

  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <g transform="translate(0,0)">
    <circle cx="600" cy="390" r="68"
            fill="#C9A84C" fill-opacity="0.15"
            stroke="#C9A84C" stroke-width="2" opacity="0.65"/>
    <text x="600" y="380" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="19"
          letter-spacing="1.5" fill="#C9A84C" opacity="0.80">INCENTIVE</text>
    <text x="600" y="400" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          fill="#C9A84C" opacity="0.72">/</text>
    <text x="600" y="418" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="18"
          letter-spacing="1" fill="#C9A84C" opacity="0.80">MEASURE</text>
    <line x1="528" y1="410" x2="370" y2="610"
          stroke="#8A9BB0" stroke-width="1.5" opacity="0.55" stroke-dasharray="5 3"/>
    <rect x="195" y="620" width="250" height="110" rx="10"
          fill="#8A9BB0" fill-opacity="0.06" stroke="#8A9BB0" stroke-width="1.5"
          opacity="0.55" stroke-dasharray="5 3"/>
    <text x="290" y="660" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20"
          letter-spacing="1" fill="#8A9BB0" opacity="0.65">INTENDED EFFECT</text>
    <text x="290" y="684" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          fill="#8A9BB0" opacity="0.55">↓ problem reduced</text>
    <text x="290" y="705" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          fill="#8A9BB0" opacity="0.45">(hoped for)</text>
    <line x1="672" y1="410" x2="790" y2="610"
          stroke="#C9A84C" stroke-width="2" opacity="0.60"/>
    <polygon points="786,618 796,602 802,616"
             fill="#C9A84C" opacity="0.60"/>
    <rect x="750" y="620" width="250" height="110" rx="10"
          fill="#C9A84C" fill-opacity="0.12" stroke="#C9A84C" stroke-width="2" opacity="0.60"/>
    <text x="870" y="660" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20"
          letter-spacing="1" fill="#C9A84C" opacity="0.80">ACTUAL EFFECT</text>
    <text x="870" y="684" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="18"
          fill="#C9A84C" opacity="0.72">↑ problem amplified</text>
    <text x="870" y="705" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          fill="#C9A84C" opacity="0.65">(perverse incentive)</text>
    <path d="M 870 732 C 950 800 750 590 658 445"
          fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.55" stroke-dasharray="4 4"/>
    <polygon points="652,438 670,452 676,434"
             fill="#C9A84C" opacity="0.55"/>
    <text x="600" y="848" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="1" fill="#8A9BB0" opacity="0.55">Ex: bounty for cobras → locals breed cobras → population explodes.</text>
  </g>

  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Cobra Effect</text>

  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">An incentive designed to solve a problem ends up making it worse.</text>

  <text x="60" y="1172"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1172" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
