<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Effet cobra</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Phénomène dans lequel une mesure incitative produit exactement l'effet inverse de celui recherché, en raison d'une mauvaise anticipation des comportements adaptatifs.</dc:description>
    <dc:subject>Économie &amp; Incitations, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">ÉCONOMIE &amp; INCITATIONS</text>

  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <g transform="translate(0,0)">
    <text x="600" y="275" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="19"
          letter-spacing="2" fill="#8A9BB0" opacity="0.65">PROBLÈME INITIAL</text>
    <line x1="600" y1="285" x2="600" y2="318"
          stroke="#8A9BB0" stroke-width="1.5" opacity="0.55"/>
    <polygon points="594,318 606,318 600,330"
             fill="#8A9BB0" opacity="0.55"/>
    <circle cx="600" cy="390" r="68"
            fill="#C9A84C" fill-opacity="0.15" stroke="#C9A84C" stroke-width="2" opacity="0.65"/>
    <text x="600" y="382" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="16"
          letter-spacing="1" fill="#C9A84C" opacity="0.80">INCITATION</text>
    <text x="600" y="404" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          fill="#C9A84C" opacity="0.72">/ MESURE</text>
    <line x1="524" y1="425" x2="304" y2="636"
          stroke="#8A9BB0" stroke-width="2" opacity="0.35" stroke-dasharray="6 4"/>
    <polygon points="294,646 314,646 304,660"
             fill="#8A9BB0" opacity="0.35"/>
    <rect x="195" y="660" width="210" height="80" rx="10"
          fill="#8A9BB0" fill-opacity="0.09" stroke="#8A9BB0" stroke-width="1.5" opacity="0.35"/>
    <text x="300" y="702" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="19"
          letter-spacing="1" fill="#8A9BB0" opacity="0.65">EFFET VOULU</text>
    <text x="300" y="724" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          fill="#8A9BB0" opacity="0.55">↓ problème réduit</text>
    <line x1="676" y1="425" x2="856" y2="636"
          stroke="#C9A84C" stroke-width="2.5" opacity="0.65"/>
    <polygon points="866,646 846,646 856,660"
             fill="#C9A84C" opacity="0.65"/>
    <rect x="755" y="660" width="230" height="80" rx="10"
          fill="#C9A84C" fill-opacity="0.12" stroke="#C9A84C" stroke-width="2" opacity="0.60"/>
    <text x="870" y="702" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="19"
          letter-spacing="1" fill="#C9A84C" opacity="0.80">EFFET RÉEL</text>
    <text x="870" y="724" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          fill="#C9A84C" opacity="0.72">↑ problème amplifié</text>
    <path d="M 920,700 C 990,770 650,810 625,460"
          fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.55" stroke-dasharray="5 4"/>
    <polygon points="618,447 632,447 625,462"
             fill="#C9A84C" opacity="0.55"/>
    <text x="600" y="848" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="1" fill="#8A9BB0" opacity="0.55">Ex. : prime pour cobras tués → élevage de cobras → plus de cobras</text>
  </g>

  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Effet cobra</text>

  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">Une solution mal conçue aggrave le problème qu'elle cherche à résoudre.</text>

  <text x="60" y="1172"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1172" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
