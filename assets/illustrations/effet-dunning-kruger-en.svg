<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Dunning-Kruger Effect</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Cognitive bias described by Dunning and Kruger in 1999: people with limited competence overestimate their abilities, while experts tend to underestimate theirs.</dc:description>
    <dc:subject>Psychology &amp; Behaviour, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">PSYCHOLOGY &amp; BEHAVIOUR</text>

  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <g transform="translate(0,0)">

    <line x1="200" y1="840" x2="1052" y2="840"
          stroke="#8A9BB0" stroke-width="1.5" opacity="0.28"/>
    <polygon points="1052,834 1064,840 1052,846"
             fill="#8A9BB0" opacity="0.28"/>
    <line x1="200" y1="840" x2="200" y2="208"
          stroke="#8A9BB0" stroke-width="1.5" opacity="0.28"/>
    <polygon points="194,208 200,196 206,208"
             fill="#8A9BB0" opacity="0.28"/>
    <text x="620" y="880" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="2" fill="#8A9BB0" opacity="0.72">EXPERIENCE &amp; COMPETENCE</text>
    <text transform="translate(168, 530) rotate(-90)"
          text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="2" fill="#8A9BB0" opacity="0.72">CONFIDENCE</text>
    <line x1="400" y1="285" x2="400" y2="840"
          stroke="#8A9BB0" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.45"/>
    <line x1="660" y1="770" x2="660" y2="840"
          stroke="#8A9BB0" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.45"/>
    <path d="M 200,700 C 280,700 338,275 400,275
             C 500,275 520,830 660,760
             C 820,690 900,430 1040,445
             C 1060,446 1070,445 1080,444"
          fill="#C9A84C" fill-opacity="0.06"/>
    <path d="M 200,700 C 280,700 338,275 400,275
             C 500,275 520,830 660,760
             C 820,690 900,430 1040,445
             C 1060,446 1070,445 1080,444"
          fill="none" stroke="#C9A84C" stroke-width="3" opacity="0.90"
          stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="200" cy="700" r="4" fill="#C9A84C" opacity="0.55"/>
    <circle cx="400" cy="275" r="6" fill="#C9A84C" opacity="0.92"/>
    <circle cx="660" cy="760" r="6" fill="#8A9BB0" opacity="0.70"/>
    <circle cx="1040" cy="445" r="6" fill="#C9A84C" opacity="0.92"/>
    <line x1="406" y1="271" x2="438" y2="239"
          stroke="#C9A84C" stroke-width="1.5" opacity="0.72"/>
    <text x="444" y="231" text-anchor="start"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20"
          letter-spacing="1" fill="#C9A84C" opacity="0.88">PEAK OF MOUNT STUPID</text>
    <line x1="660" y1="767" x2="660" y2="794"
          stroke="#8A9BB0" stroke-width="1.5" opacity="0.72"/>
    <text x="660" y="812" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20"
          letter-spacing="1" fill="#8A9BB0" opacity="0.75">VALLEY OF DESPAIR</text>
    <line x1="1033" y1="441" x2="998" y2="409"
          stroke="#C9A84C" stroke-width="1.5" opacity="0.72"/>
    <text x="992" y="401" text-anchor="end"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20"
          letter-spacing="1" fill="#C9A84C" opacity="0.88">MASTERY</text>
    <text x="300" y="905" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="1.5" fill="#8A9BB0" opacity="0.55">IGNORANCE</text>
    <text x="530" y="905" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="1.5" fill="#8A9BB0" opacity="0.55">AWARENESS</text>
    <text x="850" y="905" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="1.5" fill="#8A9BB0" opacity="0.55">GROWING EXPERTISE</text>

  </g>

  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Dunning-Kruger Effect</text>

  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">The less you know, the more confident you feel.</text>

  <text x="60" y="1172"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1172" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
