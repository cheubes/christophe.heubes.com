    <dc:description>Biais cognitif identifié par Edward Thorndike (1920) : l'impression favorable que laisse un trait saillant oriente inconsciemment le jugement porté sur tous les autres traits.</dc:description>
    <dc:subject>Biais &amp; Heuristiques, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

