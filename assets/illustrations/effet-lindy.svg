<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Effet Lindy</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Concept popularisé par Nassim Taleb : pour les objets non périssables (idées, livres, technologies), l'espérance de vie future est proportionnelle à l'âge actuel.</dc:description>
    <dc:subject>Épistémologie, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">ÉPISTÉMOLOGIE</text>

  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <g transform="translate(0,0)">

    <line x1="600" y1="245" x2="600" y2="810"
          stroke="#8A9BB0" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.55"/>
    <text x="600" y="234" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="18"
          letter-spacing="2" fill="#8A9BB0" opacity="0.72">MAINTENANT</text>
    <text x="390" y="290" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="2" fill="#8A9BB0" opacity="0.65">PASSÉ</text>
    <text x="820" y="290" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="2" fill="#8A9BB0" opacity="0.65">FUTUR ESTIMÉ</text>
    <rect x="480" y="343" width="120" height="54" rx="4"
          fill="#8A9BB0" opacity="0.39"/>
    <rect x="600" y="343" width="120" height="54" rx="4"
          fill="#C9A84C" opacity="0.52"/>
    <text x="466" y="375" text-anchor="end"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20"
          letter-spacing="1" fill="#8A9BB0" opacity="0.80">RÉCENT</text>
    <text x="540" y="333" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="1" fill="#8A9BB0" opacity="0.65">2 ans</text>
    <text x="734" y="375" text-anchor="start"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="1" fill="#C9A84C" opacity="0.80">≈ 2 ans</text>
    <rect x="205" y="623" width="395" height="54" rx="4"
          fill="#8A9BB0" opacity="0.45"/>
    <rect x="600" y="623" width="440" height="54" rx="4"
          fill="#C9A84C" opacity="0.78"/>
    <text x="191" y="655" text-anchor="end"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20"
          letter-spacing="1" fill="#C9A84C" opacity="0.85">ÉTABLI</text>
    <text x="402.5" y="613" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="1" fill="#8A9BB0" opacity="0.65">50 ans</text>
    <text x="1054" y="655" text-anchor="start"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="19"
          letter-spacing="1" fill="#C9A84C" opacity="0.85">≈ 50 ans</text>
    <text x="820" y="709" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="1" fill="#C9A84C" opacity="0.72">futur ≥ passé</text>

  </g>

  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Effet Lindy</text>

  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">Plus quelque chose a duré, plus ça durera longtemps.</text>

  <text x="60" y="1172"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1172" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
