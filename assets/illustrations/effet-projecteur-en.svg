<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Spotlight Effect</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>We think we are constantly in the spotlight, while others are absorbed in their own inner world.</dc:description>
    <dc:subject>Psychology &amp; Behaviour, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">PSYCHOLOGY &amp; BEHAVIOUR</text>

  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <g transform="translate(0,0)">

    <defs>
      <linearGradient id="coneGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#E8D5A3" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#C9A84C"      stop-opacity="0.18"/>
      </linearGradient>
      <radialGradient id="projGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#E8D5A3" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#E8D5A3" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="tinySpot" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#E8D5A3" stop-opacity="0.30"/>
        <stop offset="100%" stop-color="#E8D5A3" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <line x1="600" y1="115" x2="600" y2="915"
          stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

    <path d="M 300,155 L 70,879 L 530,879 Z"
          fill="url(#coneGrad)"/>

    <ellipse cx="300" cy="879" rx="230" ry="20"
             fill="#C9A84C" opacity="0.18"/>

    <circle cx="300" cy="155" r="26" fill="url(#projGlow)"/>
    <circle cx="300" cy="155" r="8"  fill="#E8D5A3"/>

    <circle cx="300" cy="700" r="44"
            fill="#E8D5A3" opacity="0.95"/>
    <rect x="274" y="749" width="52" height="130" rx="10"
          fill="#E8D5A3" opacity="0.95"/>

    <circle cx="900" cy="700" r="58" fill="url(#tinySpot)"/>

    <circle cx="900" cy="700" r="44"
            fill="#8A9BB0" opacity="0.48"/>
    <rect x="874" y="749" width="52" height="130" rx="10"
          fill="#8A9BB0" opacity="0.48"/>

    <text x="300" y="138" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="21"
          letter-spacing="2" fill="#8A9BB0">YOUR PERCEPTION</text>
    <text x="900" y="138" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="21"
          letter-spacing="2" fill="#8A9BB0">THE REALITY</text>

  </g>

  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Spotlight Effect</text>

  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">We overestimate the attention others pay to us.</text>

  <text x="60" y="1172"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1172" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
