<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">
  <metadata>
    <dc:title>Ringelmann Effect</dc:title>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">PSYCHOLOGY &amp; BEHAVIOUR</text>

  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <g transform="translate(0,0)">

    <line x1="183" y1="195" x2="183" y2="684"
          stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>
    <line x1="183" y1="680" x2="995" y2="680"
          stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>
      <line x1="177" y1="559" x2="183" y2="559"
            stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>
      <text x="171" y="564" text-anchor="end"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#8A9BB0" opacity="0.55">25%</text>
      <line x1="183" y1="559" x2="995" y2="559"
            stroke="#8A9BB0" stroke-width="1.5" opacity="0.20" stroke-dasharray="4 6"/>
      <line x1="177" y1="437" x2="183" y2="437"
            stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>
      <text x="171" y="442" text-anchor="end"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#8A9BB0" opacity="0.55">50%</text>
      <line x1="183" y1="437" x2="995" y2="437"
            stroke="#8A9BB0" stroke-width="1.5" opacity="0.20" stroke-dasharray="4 6"/>
      <line x1="177" y1="316" x2="183" y2="316"
            stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>
      <text x="171" y="321" text-anchor="end"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#8A9BB0" opacity="0.55">75%</text>
      <line x1="183" y1="316" x2="995" y2="316"
            stroke="#8A9BB0" stroke-width="1.5" opacity="0.20" stroke-dasharray="4 6"/>
      <line x1="177" y1="195" x2="183" y2="195"
            stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>
      <text x="171" y="200" text-anchor="end"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#8A9BB0" opacity="0.55">100%</text>
      <line x1="183" y1="195" x2="995" y2="195"
            stroke="#8A9BB0" stroke-width="1.5" opacity="0.20" stroke-dasharray="4 6"/>
    <text x="143" y="442.5" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="1" fill="#8A9BB0" opacity="0.55"
          transform="rotate(-90, 143, 437.5)">individual effort</text>
      <rect x="195" y="195" width="130" height="485" rx="5"
            fill="#C9A84C" fill-opacity="0.48" stroke="#C9A84C" stroke-width="1.5" opacity="0.80"/>
      <text x="260" y="181" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17"
            fill="#C9A84C" opacity="0.80">100%</text>
      <text x="260" y="704" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
            fill="#C9A84C" opacity="0.80">1 person</text>
      <rect x="380" y="229" width="130" height="451" rx="5"
            fill="#C9A84C" fill-opacity="0.30" stroke="#C9A84C" stroke-width="1.5" opacity="0.60"/>
      <text x="445" y="215" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17"
            fill="#C9A84C" opacity="0.60">93%</text>
      <text x="445" y="704" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
            fill="#C9A84C" opacity="0.60">2 people</text>
      <rect x="565" y="307" width="130" height="373" rx="5"
            fill="#8A9BB0" fill-opacity="0.42" stroke="#8A9BB0" stroke-width="1.5" opacity="0.50"/>
      <text x="630" y="293" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17"
            fill="#8A9BB0" opacity="0.50">77%</text>
      <text x="630" y="704" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
            fill="#8A9BB0" opacity="0.50">4 people</text>
      <rect x="750" y="442" width="130" height="238" rx="5"
            fill="#8A9BB0" fill-opacity="0.57" stroke="#8A9BB0" stroke-width="1.5" opacity="0.68"/>
      <text x="815" y="428" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17"
            fill="#8A9BB0" opacity="0.68">49%</text>
      <text x="815" y="704" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
            fill="#8A9BB0" opacity="0.68">8 people</text>
    <line x1="255" y1="748" x2="911" y2="748"
          stroke="#8A9BB0" stroke-width="1.5" opacity="0.45" stroke-dasharray="5 3"/>
    <polygon points="911,743 911,753 925,748"
             fill="#8A9BB0" opacity="0.45"/>
    <text x="600" y="860" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="1.5" fill="#8A9BB0" opacity="0.55">Diffused responsibility reduces each person's effort.</text>
  </g>

  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Ringelmann Effect</text>

  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">The larger the group, the less each member contributes.</text>

  <text x="60" y="1172"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1172" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>
</svg>
