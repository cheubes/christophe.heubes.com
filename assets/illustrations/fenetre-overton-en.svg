    <text x="600" y="868" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="1.5" fill="#8A9BB0" opacity="0.55">Public discourse determines where the window sits.</text>
  </g>

  <line x1="60" y1="1000" x2="1140" y2="1000"
