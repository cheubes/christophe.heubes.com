    <text x="833" y="373" text-anchor="start"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="1" fill="#C9A84C" opacity="0.55">window</text>
    <text x="833" y="389" text-anchor="start"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="1" fill="#C9A84C" opacity="0.55">can shift</text>
    <line x1="825" y1="307" x2="825" y2="243"
          stroke="#C9A84C" stroke-width="1.5" opacity="0.65"/>
    <polygon points="819,243 831,243 825,229"
