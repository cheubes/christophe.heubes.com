    <text x="357" y="481" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17"
          letter-spacing="2" fill="#C9A84C" opacity="0.55"
          transform="rotate(-90, 357, 481)">OVERTON WINDOW</text>
    <rect x="387" y="217" width="426" height="316" rx="10"
          fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.45"
