    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Formulated by Melvin Conway in 1967: any organisation that designs a system will produce a design whose structure mirrors the organisation's own communication structure.</dc:description>
    <dc:subject>Engineering &amp; Technology, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

