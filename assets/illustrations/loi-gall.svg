<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Loi de Gall</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Loi de John Gall (Systemantics, 1975) : un système complexe conçu directement comme tel est voué à l'échec. La complexité fonctionnelle émerge toujours d'une simplicité fonctionnelle.</dc:description>
    <dc:subject>Ingénierie &amp; Technologie, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- En-tête catégorie -->
  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">INGÉNIERIE &amp; TECHNOLOGIE</text>

  <!-- Séparateur header -->
  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <!-- Diagramme -->
  <g transform="translate(0,0)">

    <text x="600" y="270" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="19"
          letter-spacing="2" fill="#C9A84C" opacity="0.72">ÉVOLUTION DEPUIS LA SIMPLICITÉ</text>
      <line x1="227" y1="360" x2="360" y2="360"
            stroke="#C9A84C" stroke-width="2" opacity="0.50"/>
      <polygon points="360,354 360,366 372,360"
               fill="#C9A84C" opacity="0.50"/>
      <line x1="452" y1="360" x2="583" y2="360"
            stroke="#C9A84C" stroke-width="2" opacity="0.50"/>
      <polygon points="583,354 583,366 595,360"
               fill="#C9A84C" opacity="0.50"/>
      <line x1="699" y1="360" x2="828" y2="360"
            stroke="#C9A84C" stroke-width="2" opacity="0.50"/>
      <polygon points="828,354 828,366 840,360"
               fill="#C9A84C" opacity="0.50"/>
      <circle cx="195" cy="360" r="28"
              fill="#C9A84C" fill-opacity="0.15"
              stroke="#C9A84C" stroke-width="1.8" opacity="0.55"/>
      <text x="195" y="365" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="18"
            fill="#C9A84C" opacity="0.72">v1</text>
        <text x="195" y="410" text-anchor="middle"
              font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
              letter-spacing="1" fill="#C9A84C" opacity="0.72">simple</text>
      <circle cx="410" cy="360" r="38"
              fill="#C9A84C" fill-opacity="0.15"
              stroke="#C9A84C" stroke-width="1.8" opacity="0.55"/>
      <text x="410" y="365" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="18"
            fill="#C9A84C" opacity="0.72">v2</text>
      <circle cx="645" cy="360" r="50"
              fill="#C9A84C" fill-opacity="0.15"
              stroke="#C9A84C" stroke-width="1.8" opacity="0.55"/>
      <text x="645" y="365" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="18"
            fill="#C9A84C" opacity="0.72">v3</text>
      <circle cx="905" cy="360" r="65"
              fill="#C9A84C" fill-opacity="0.27"
              stroke="#C9A84C" stroke-width="2.5" opacity="0.80"/>
      <text x="905" y="365" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20"
            fill="#C9A84C" opacity="0.80">vN</text>
        <text x="905" y="447" text-anchor="middle"
              font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
              letter-spacing="1" fill="#C9A84C" opacity="0.72">complexe</text>
    <text x="905" y="277" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22"
          fill="#C9A84C" opacity="0.75">✓ FONCTIONNE</text>
    <line x1="185" y1="510" x2="1015" y2="510"
          stroke="#8A9BB0" stroke-width="1.5" opacity="0.45" stroke-dasharray="4 6"/>
    <text x="490" y="625" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="19"
          letter-spacing="2" fill="#8A9BB0" opacity="0.65">CONÇU DIRECTEMENT COMPLEXE</text>
    <rect x="185" y="625" width="560" height="100" rx="14"
          fill="#8A9BB0" fill-opacity="0.08" stroke="#8A9BB0" stroke-width="1.5" opacity="0.55"
          stroke-dasharray="5 4"/>
    <text x="465" y="672" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="16"
          letter-spacing="2" fill="#8A9BB0" opacity="0.65">SYSTÈME COMPLEXE</text>
    <text x="465" y="698" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          fill="#8A9BB0" opacity="0.55">conçu d'emblée comme tel</text>
    <line x1="757" y1="672" x2="840" y2="672"
          stroke="#8A9BB0" stroke-width="2" opacity="0.55"/>
    <polygon points="840,666 840,678 854,672"
             fill="#8A9BB0" opacity="0.55"/>
    <text x="905" y="664" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22"
          fill="#8A9BB0" opacity="0.65">✗ ÉCHOUE</text>
  </g>

  <!-- Séparateur footer -->
  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <!-- Footer : titre -->
  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Loi de Gall</text>

  <!-- Footer : tagline -->
  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">Tout système complexe qui fonctionne a évolué depuis un système simple qui fonctionnait.</text>

  <!-- Footer : attribution -->
  <text x="60" y="1172"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1172" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
