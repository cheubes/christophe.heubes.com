<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Goodhart's Law</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Principle formulated by economist Charles Goodhart in 1975: once an indicator is used as a target, it loses its diagnostic value.</dc:description>
    <dc:subject>Economics &amp; Incentives, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- Category header -->
  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">ECONOMICS &amp; INCENTIVES</text>

  <!-- Header separator -->
  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <!-- Diagram -->
  <g transform="translate(0,0)">

    <line x1="165" y1="400" x2="1038" y2="400"
          stroke="#8A9BB0" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.45"/>
    <line x1="165" y1="560" x2="1038" y2="560"
          stroke="#8A9BB0" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.45"/>
    <line x1="165" y1="720" x2="1038" y2="720"
          stroke="#8A9BB0" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.45"/>
    <line x1="555" y1="170" x2="555" y2="850"
          stroke="#8A9BB0" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.55"/>
    <polygon points="547,168 563,168 555,182"
             fill="#C9A84C" opacity="0.80"/>
    <text x="555" y="159" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="18"
          letter-spacing="1.5" fill="#C9A84C" opacity="0.80">BECOMES A TARGET</text>
    <path d="M 555,460 C 700,460 880,215 1038,215
             L 1038,660 C 905,660 700,510 555,510 Z"
          fill="#C9A84C" fill-opacity="0.06"/>
    <path d="M 165,760 C 285,760 440,510 555,510
             C 700,510 905,660 1038,660"
          fill="none" stroke="#8A9BB0" stroke-width="2.5" opacity="0.65"
          stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 165,720 C 285,720 440,460 555,460
             C 700,460 880,215 1038,215"
          fill="none" stroke="#C9A84C" stroke-width="3" opacity="0.90"
          stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="555" cy="460" r="5" fill="#C9A84C" opacity="0.90"/>
    <circle cx="555" cy="510" r="4" fill="#8A9BB0" opacity="0.65"/>
    <text x="1052" y="221" text-anchor="start"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20"
          letter-spacing="1.5" fill="#C9A84C" opacity="0.90">METRIC</text>
    <text x="1052" y="656" text-anchor="start"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="1" fill="#8A9BB0" opacity="0.65">TARGET</text>
    <text x="1052" y="674" text-anchor="start"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="1" fill="#8A9BB0" opacity="0.65">REALITY</text>
    <text x="360" y="886" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="1.5" fill="#8A9BB0" opacity="0.72">CORRELATED</text>
    <text x="796" y="886" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="1.5" fill="#8A9BB0" opacity="0.72">DECOUPLED</text>
  </g>

  <!-- Footer separator -->
  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <!-- Footer: title -->
  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Goodhart's Law</text>

  <!-- Footer: tagline -->
  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">When a measure becomes a target, it ceases to be a good measure.</text>

  <!-- Footer: attribution -->
  <text x="60" y="1172"
