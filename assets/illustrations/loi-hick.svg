          letter-spacing="1" fill="#8A9BB0" opacity="0.72">4</text>
    <rect x="605" y="360" width="120" height="380" rx="4"
          fill="#8A9BB0" opacity="0.65"/>
    <text x="665" y="762" text-anchor="middle"
