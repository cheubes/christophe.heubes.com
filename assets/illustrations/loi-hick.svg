    <rect x="195" y="550" width="120" height="190" rx="4"
          fill="#8A9BB0" opacity="0.3"/>
    <text x="255" y="762" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="16"
          letter-spacing="1" fill="#8A9BB0" opacity="0.65">2</text>
    <rect x="400" y="461" width="120" height="279" rx="4"
          fill="#8A9BB0" opacity="0.48"/>
    <text x="460" y="762" text-anchor="middle"
