  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Loi de Hofstadter</text>

  <!-- Footer : tagline -->
  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">Ça prend toujours plus longtemps que prévu, même en tenant compte de la loi de Hofstadter.</text>

  <!-- Footer : attribution -->
  <text x="60" y="1172"
