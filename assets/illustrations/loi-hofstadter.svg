    <text x="1040" y="698" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="1" fill="#C9A84C" opacity="0.72">×2.7</text>
