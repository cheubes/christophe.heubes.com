<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">
  <metadata>
    <dc:title>Kerr's Law</dc:title>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <!-- Fond -->
  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- En-tête catégorie -->
  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">ECONOMICS &amp; INCENTIVES</text>

  <!-- Séparateur header -->
  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <!-- Diagramme -->
  <g transform="translate(0,0)">

    <rect x="185" y="370" width="270" height="160" rx="12"
          fill="#C9A84C" fill-opacity="0.14" stroke="#C9A84C" stroke-width="1.5" opacity="0.70"/>
    <text x="320" y="418" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="34"
          fill="#C9A84C" opacity="0.82">A</text>
    <text x="320" y="452" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="19"
          letter-spacing="2" fill="#C9A84C" opacity="0.60">WHAT WE REWARD</text>
    <text x="320" y="476" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          fill="#C9A84C" opacity="0.65">what is measured</text>

    <rect x="685" y="370" width="270" height="160" rx="12"
          fill="#8A9BB0" fill-opacity="0.08" stroke="#8A9BB0" stroke-width="1.5" opacity="0.55"
          stroke-dasharray="6 4"/>
    <text x="820" y="418" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="34"
          fill="#8A9BB0" opacity="0.65">B</text>
    <text x="820" y="452" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="19"
          letter-spacing="2" fill="#8A9BB0" opacity="0.60">WHAT WE HOPE FOR</text>
    <text x="820" y="476" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          fill="#8A9BB0" opacity="0.55">the real objective</text>

    <text x="570" y="464" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="44"
          fill="#8A9BB0" opacity="0.55">≠</text>

    <text x="320" y="580" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="16"
          letter-spacing="2" fill="#C9A84C" opacity="0.72">ACTUAL BEHAVIOR</text>
    <line x1="320" y1="600" x2="320" y2="542"
          stroke="#C9A84C" stroke-width="3" opacity="0.65"/>
    <polygon points="312,542 328,542 320,530"
             fill="#C9A84C" opacity="0.65"/>

    <line x1="820" y1="600" x2="820" y2="560"
          stroke="#8A9BB0" stroke-width="1.5" opacity="0.45" stroke-dasharray="4 4"/>
    <text x="820" y="580" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="19"
          letter-spacing="1" fill="#8A9BB0" opacity="0.55">HOPED-FOR BEHAVIOR</text>

    <text x="600" y="840" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="1.5" fill="#8A9BB0" opacity="0.65">Incentives drive actions. Not stated objectives.</text>

  </g>

  <!-- Séparateur footer -->
  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <!-- Titre footer -->
  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Kerr's Law</text>

  <!-- Sous-titre footer -->
  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">We reward A, we hope for B — and we get A.</text>

  <!-- Attribution -->
  <text x="60" y="1172"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1172" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>
</svg>
