<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">
  <metadata>
    <dc:title>Pareto's Law</dc:title>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <!-- Fond -->
  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- En-tête catégorie -->
  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">ECONOMICS &amp; INCENTIVES</text>

  <!-- Séparateur header -->
  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <!-- Diagramme -->
  <g transform="translate(0,0)">

    <line x1="600" y1="115" x2="600" y2="876"
          stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

    <text x="350" y="156" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="21"
          letter-spacing="2" fill="#8A9BB0">CAUSES</text>
    <text x="850" y="156" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="21"
          letter-spacing="2" fill="#8A9BB0">EFFECTS</text>

    <rect x="240" y="185" width="220"
          height="128" rx="8"
          fill="#C9A84C" opacity="0.90"/>
    <rect x="240" y="313" width="220"
          height="512" rx="8"
          fill="#8A9BB0" opacity="0.33"/>
    <rect x="740" y="185" width="220"
          height="512" rx="8"
          fill="#C9A84C" opacity="0.90"/>
    <rect x="740" y="697" width="220"
          height="128" rx="8"
          fill="#8A9BB0" opacity="0.33"/>

    <text x="350" y="269" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="52"
          fill="#0D1B2A">20%</text>
    <text x="850" y="461" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="52"
          fill="#0D1B2A">80%</text>

    <defs>
      <marker id="ah" markerWidth="10" markerHeight="7"
              refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#C9A84C" opacity="0.80"/>
      </marker>
    </defs>
    <path d="M 470,249
             C 600,249 600,441
               730,441"
          fill="none" stroke="#C9A84C" stroke-width="2.5"
          stroke-dasharray="8,5" opacity="0.70"
          marker-end="url(#ah)"/>

  </g>

  <!-- Séparateur footer -->
  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <!-- Titre footer -->
  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Pareto's Law</text>

  <!-- Sous-titre footer -->
  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">20% of causes produce 80% of effects.</text>

  <!-- Attribution -->
  <text x="60" y="1172"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1172" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>
</svg>
