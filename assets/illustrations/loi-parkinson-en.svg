<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">
  <metadata>
    <dc:title>Parkinson's Law</dc:title>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <!-- Fond -->
  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- En-tête catégorie -->
  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">MANAGEMENT &amp; ORGANISATIONS</text>

  <!-- Séparateur header -->
  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <!-- Diagramme -->
  <g transform="translate(0,0)">

    <line x1="600" y1="115" x2="600" y2="876"
          stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

    <text x="300" y="155" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="2" fill="#8A9BB0">SHORT</text>
    <text x="300" y="182" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22"
          letter-spacing="2.5" fill="#C9A84C">DEADLINE</text>

    <text x="900" y="155" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="2" fill="#8A9BB0">LONG</text>
    <text x="900" y="182" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22"
          letter-spacing="2.5" fill="#8A9BB0">DEADLINE</text>

    <rect x="242" y="215" width="116" height="200"
          rx="5" fill="#C9A84C" opacity="0.88"/>
    <rect x="842" y="215" width="116" height="200"
          rx="5" fill="#C9A84C" opacity="0.88"/>

    <!-- Expansion zone — work dilates to fill time -->
    <rect x="842" y="418" width="116" height="294"
          rx="5" fill="#E8D5A3" opacity="0.18"/>
    <rect x="842" y="418" width="116" height="294"
          rx="5" fill="none" stroke="#8A9BB0" stroke-width="1.5"
          stroke-dasharray="6,4" opacity="0.45"/>

    <line x1="232" y1="415" x2="368" y2="415"
          stroke="#E8D5A3" stroke-width="2" opacity="0.55"/>
    <line x1="832" y1="415" x2="968" y2="415"
          stroke="#E8D5A3" stroke-width="2" opacity="0.55"/>

    <text x="600" y="403" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="20"
          letter-spacing="1.5" fill="#E8D5A3" opacity="0.68">IDENTICAL RESULT</text>

    <text x="900" y="555" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="20"
          letter-spacing="1.8" fill="#8A9BB0" opacity="0.72">EXPANDED</text>
    <text x="900" y="577" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="20"
          letter-spacing="1.8" fill="#8A9BB0" opacity="0.72">WORK</text>

    <text x="300" y="459" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="48"
          fill="#C9A84C" opacity="0.88">×1</text>
    <text x="300" y="487" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="1" fill="#8A9BB0" opacity="0.72">baseline</text>

    <text x="900" y="759" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="48"
          fill="#8A9BB0" opacity="0.72">×2.5</text>
    <text x="900" y="787" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="17"
          letter-spacing="1" fill="#8A9BB0" opacity="0.72">longer</text>

  </g>

  <!-- Séparateur footer -->
  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <!-- Titre footer -->
  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Parkinson's Law</text>

  <!-- Sous-titre footer -->
  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">Work expands to fill the time available for its completion.</text>

  <!-- Attribution -->
  <text x="60" y="1172"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1172" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>
</svg>
