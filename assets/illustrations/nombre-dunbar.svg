<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Nombre de Dunbar</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Robin Dunbar a identifié une limite cognitive au nombre de relations sociales stables qu'un individu peut entretenir, organisées en cercles concentriques.</dc:description>
    <dc:subject>Management &amp; Organisations, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <!-- Fond -->
  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- Header -->
  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">MANAGEMENT &amp; ORGANISATIONS</text>
  <!-- Séparateur header -->
  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <!-- Zone principale -->
  <g transform="translate(0,0)">

    <circle cx="600" cy="540" r="385"
            fill="#0D1B2A" stroke="#3a5068" stroke-width="1.5"/>
    <circle cx="600" cy="540" r="285"
            fill="#0D1B2A" stroke="#8A9BB0" stroke-width="2"/>
    <circle cx="600" cy="540" r="185"
            fill="#0D1B2A" stroke="#E8D5A3" stroke-width="2"/>
    <circle cx="600" cy="540" r="90"
            fill="#0D1B2A" stroke="#C9A84C" stroke-width="3"/>
    <circle cx="600" cy="540" r="7" fill="#C9A84C"/>
    <text x="600" y="205" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="46"
          fill="#8A9BB0">150</text>
    <text x="600" y="243" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
          fill="#8A9BB0">Relations</text>
    <text x="600" y="305" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="46"
          fill="#F0EDE4">50</text>
    <text x="600" y="343" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
          fill="#8A9BB0">Amis</text>
    <text x="600" y="403" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="46"
          fill="#E8D5A3">15</text>
    <text x="600" y="441" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
          fill="#F0EDE4">Amis proches</text>
    <text x="600" y="486" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="46"
          fill="#C9A84C">5</text>
    <text x="600" y="524" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
          fill="#F0EDE4">Intimes</text>
  </g>

  <!-- Séparateur footer -->
  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <!-- Footer : titre -->
  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Nombre de Dunbar</text>

  <!-- Footer : tagline -->
  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">Nous ne pouvons maintenir que ~150 relations stables.</text>

  <!-- Footer : attribution -->
  <text x="60" y="1172"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1172" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
