  <metadata>
    <dc:title>Paradoxe d'Abilène</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Décrit par Jerry Harvey (1974) : dans un groupe, chacun suppose que les autres approuvent une idée et valide par politesse — menant à une décision unanime que personne ne souhaitait.</dc:description>
    <dc:subject>Management &amp; Organisations, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <!-- Fond -->
  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- Header -->
  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">MANAGEMENT &amp; ORGANISATIONS</text>
  <!-- Séparateur header -->
  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

