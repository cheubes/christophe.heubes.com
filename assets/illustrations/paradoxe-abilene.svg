      <line x1="477" y1="450" x2="423" y2="432"
            stroke="#8A9BB0" stroke-width="1.5" opacity="0.45" stroke-dasharray="4 3"/>
      <circle cx="389" cy="421" r="30"
              fill="#8A9BB0" fill-opacity="0.21"
              stroke="#8A9BB0" stroke-width="1.8" opacity="0.48"/>
      <text x="336" y="409" text-anchor="middle"
