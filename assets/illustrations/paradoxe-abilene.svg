    <text x="600" y="858" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="1.5" fill="#8A9BB0" opacity="0.55">Chacun pense que les autres veulent — alors personne n'ose dire non.</text>
  </g>

  <!-- Séparateur footer -->
  <line x1="60" y1="1000" x2="1140" y2="1000"
