    <text x="1134" y="914" text-anchor="start"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="44" font-style="italic"
          fill="#F0EDE4">Q</text>
    <path d="M 350,46 L 362,141 L 370,189 L 380,240 L 390,278 L 400,314 L 415,358 L 430,393 L 450,430 L 475,469 L 500,498 L 540,536 L 580,566 L 630,594 L 700,624 L 750,641 L 800,656 L 860,670 L 950,688 L 1050,704 L 1100,711"
          clip-path="url(#cz)"
