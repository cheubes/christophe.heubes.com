    <line x1="287" y1="670" x2="313" y2="670"
          stroke="#F0EDE4" stroke-width="2.5"/>
    <line x1="450" y1="887" x2="450" y2="913"
          stroke="#F0EDE4" stroke-width="2.5"/>
    <line x1="860" y1="887" x2="860" y2="913"
          stroke="#F0EDE4" stroke-width="2.5"/>
    <text x="274" y="535" text-anchor="end"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="23"
          fill="#F0EDE4">price drops</text>
    <text x="274" y="567" text-anchor="end"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="23"
          fill="#C9A84C">by half</text>
    <text x="655" y="944" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="23"
          fill="#F0EDE4">demand increases</text>
    <text x="655" y="976" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="23"
          fill="#C9A84C">by more than half</text>
    <text x="878" y="655" text-anchor="start"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="27" font-style="italic"
          fill="#E8D5A3">demand</text>
