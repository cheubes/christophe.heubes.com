<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Jevons Paradox</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>When a resource becomes more efficient to use, its total consumption increases rather than decreases.</dc:description>
    <dc:subject>Economics &amp; Incentives, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <!-- Fond -->
  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- Header -->
  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">ECONOMICS &amp; INCENTIVES</text>
  <!-- Séparateur header -->
  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <!-- Zone principale -->
  <g transform="translate(0,0)">

    <defs>
      <marker id="axArr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8A9BB0"/>
      </marker>
      <clipPath id="cz">
        <rect x="300" y="135" width="810" height="765"/>
      </clipPath>
    </defs>
    <line x1="300" y1="900" x2="1110" y2="900"
          stroke="#8A9BB0" stroke-width="3" marker-end="url(#axArr)"/>
    <line x1="300" y1="900" x2="300" y2="135"
