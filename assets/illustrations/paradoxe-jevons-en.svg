    <line x1="450" y1="430" x2="450" y2="900"
          stroke="#8A9BB0" stroke-width="2" stroke-dasharray="10,6" opacity="0.65"/>
    <line x1="860" y1="670" x2="860" y2="900"
          stroke="#8A9BB0" stroke-width="2" stroke-dasharray="10,6" opacity="0.65"/>
    <circle cx="450" cy="430" r="10" fill="#C9A84C"/>
    <circle cx="860" cy="670" r="10" fill="#C9A84C"/>
    <line x1="287" y1="430" x2="313" y2="430"
