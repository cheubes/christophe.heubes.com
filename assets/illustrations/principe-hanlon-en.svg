<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Hanlon's Razor</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Hanlon's razor: faced with negative behaviour, the explanation through error or incompetence is statistically more probable than intentional malice.</dc:description>
    <dc:subject>Epistemology, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <!-- Fond -->
  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- Header -->
  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">EPISTEMOLOGY</text>
  <!-- Séparateur header -->
  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <!-- Zone principale -->
  <g transform="translate(0,0)">

    <text x="600" y="222" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="20"
          letter-spacing="2" fill="#8A9BB0" opacity="0.65">WHY DID SOMETHING GO WRONG?</text>
    <line x1="380" y1="270" x2="380" y2="688"
          stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>
      <rect x="380" y="310" width="620" height="58" rx="8"
            fill="#8A9BB0" fill-opacity="0.08" stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>
      <rect x="380" y="460" width="620" height="58" rx="8"
            fill="#8A9BB0" fill-opacity="0.08" stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>
      <rect x="380" y="610" width="620" height="58" rx="8"
            fill="#8A9BB0" fill-opacity="0.08" stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>
      <rect x="380" y="310" width="620" height="58" rx="8"
            fill="#C9A84C" fill-opacity="0.65" stroke="#C9A84C" stroke-width="1.5" opacity="0.75"/>
      <rect x="380" y="460" width="322" height="58" rx="8"
            fill="#8A9BB0" fill-opacity="0.35" stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>
      <rect x="380" y="610" width="124" height="58" rx="8"
            fill="#8A9BB0" fill-opacity="0.18" stroke="#8A9BB0" stroke-width="1.5" opacity="0.28"/>
      <text x="362" y="345" text-anchor="end"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="21"
            letter-spacing="1" fill="#C9A84C" opacity="0.80">ERROR / CHANCE</text>
      <text x="362" y="495" text-anchor="end"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="21"
            letter-spacing="1" fill="#8A9BB0" opacity="0.45">NEGLIGENCE</text>
      <text x="362" y="645" text-anchor="end"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="21"
            letter-spacing="1" fill="#8A9BB0" opacity="0.45">MALICE</text>
      <text x="1012" y="345" text-anchor="start"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="19"
            fill="#C9A84C" opacity="0.70">PROBABLE</text>
      <text x="714" y="495" text-anchor="start"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="19"
            fill="#8A9BB0" opacity="0.65">×0.5</text>
      <text x="516" y="645" text-anchor="start"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="19"
            fill="#8A9BB0" opacity="0.65">×0.2</text>
    <text x="600" y="765" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="1.5" fill="#8A9BB0" opacity="0.55">Start with the most probable.</text>
  </g>

  <!-- Séparateur footer -->
  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <!-- Footer : titre -->
  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Hanlon's Razor</text>

  <!-- Footer : tagline -->
  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">Never attribute to malice what can be explained by incompetence.</text>

  <!-- Footer : attribution -->
  <text x="60" y="1172"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1172" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
