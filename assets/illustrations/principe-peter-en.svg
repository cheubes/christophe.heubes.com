<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Peter Principle</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Principle formulated by Laurence J. Peter (1969): in any organization, a competent individual is promoted until reaching a position where they become incompetent — and stay there.</dc:description>
    <dc:subject>Management &amp; Organisations, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <!-- Fond -->
  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- Header -->
  <text x="60" y="58"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="26"
        fill="#8A9BB0" letter-spacing="2">MANAGEMENT &amp; ORGANISATIONS</text>
  <!-- Séparateur header -->
  <line x1="60" y1="78" x2="1140" y2="78"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <!-- Zone principale -->
  <g transform="translate(0,0)">

      <rect x="250" y="235" width="500" height="110" rx="10"
            fill="#8A9BB0" fill-opacity="0.08"
            stroke="#8A9BB0" stroke-width="2" opacity="0.38" stroke-dasharray="5 4"/>
      <text x="500" y="279" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="23"
            letter-spacing="2" fill="#8A9BB0" opacity="0.45">POSITION D</text>
      <text x="500" y="305" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
            letter-spacing="1" fill="#8A9BB0" opacity="0.55">level of incompetence</text>
        <text x="780" y="298" text-anchor="start"
              font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22"
              fill="#8A9BB0" opacity="0.45">✗</text>
        <text x="815" y="298" text-anchor="start"
              font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="19"
              letter-spacing="1" fill="#8A9BB0" opacity="0.65">STUCK</text>
      <rect x="250" y="390" width="500" height="110" rx="10"
            fill="#C9A84C" fill-opacity="0.12"
            stroke="#C9A84C" stroke-width="2" opacity="0.65" />
      <text x="500" y="434" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="23"
            letter-spacing="2" fill="#C9A84C" opacity="0.80">POSITION C</text>
      <text x="500" y="460" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
            letter-spacing="1" fill="#C9A84C" opacity="0.72">competent → promoted</text>
        <text x="780" y="453" text-anchor="start"
              font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22"
              fill="#C9A84C" opacity="0.65">✓</text>
      <rect x="250" y="545" width="500" height="110" rx="10"
            fill="#C9A84C" fill-opacity="0.12"
            stroke="#C9A84C" stroke-width="2" opacity="0.65" />
      <text x="500" y="589" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="23"
            letter-spacing="2" fill="#C9A84C" opacity="0.80">POSITION B</text>
      <text x="500" y="615" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
            letter-spacing="1" fill="#C9A84C" opacity="0.72">competent → promoted</text>
        <text x="780" y="608" text-anchor="start"
              font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22"
              fill="#C9A84C" opacity="0.65">✓</text>
      <rect x="250" y="700" width="500" height="110" rx="10"
            fill="#C9A84C" fill-opacity="0.12"
            stroke="#C9A84C" stroke-width="2" opacity="0.65" />
      <text x="500" y="744" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="23"
            letter-spacing="2" fill="#C9A84C" opacity="0.80">POSITION A</text>
      <text x="500" y="770" text-anchor="middle"
            font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
            letter-spacing="1" fill="#C9A84C" opacity="0.72">competent → promoted</text>
        <text x="780" y="763" text-anchor="start"
              font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22"
              fill="#C9A84C" opacity="0.65">✓</text>
      <line x1="210" y1="445" x2="210" y2="304"
            stroke="#C9A84C" stroke-width="2" opacity="0.45"/>
      <polygon points="203,304 217,304 210,290"
               fill="#C9A84C" opacity="0.45"/>
      <line x1="210" y1="600" x2="210" y2="459"
            stroke="#C9A84C" stroke-width="2" opacity="0.45"/>
      <polygon points="203,459 217,459 210,445"
               fill="#C9A84C" opacity="0.45"/>
      <line x1="210" y1="755" x2="210" y2="614"
            stroke="#C9A84C" stroke-width="2" opacity="0.45"/>
      <polygon points="203,614 217,614 210,600"
               fill="#C9A84C" opacity="0.45"/>
    <text x="198" y="528.5" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="18"
          letter-spacing="2" fill="#C9A84C" opacity="0.65"
          transform="rotate(-90, 198, 528.5)">PROMOTIONS</text>
    <text x="600" y="855" text-anchor="middle"
          font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18"
          letter-spacing="1.5" fill="#8A9BB0" opacity="0.55">Competence in a role leads to a different role.</text>
  </g>

  <!-- Séparateur footer -->
  <line x1="60" y1="1000" x2="1140" y2="1000"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <!-- Footer : titre -->
  <text x="60" y="1060"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="58"
        fill="#C9A84C">Peter Principle</text>

  <!-- Footer : tagline -->
  <text x="60" y="1110"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="29"
        fill="#F0EDE4">In a hierarchy, everyone rises to their level of incompetence.</text>

  <!-- Footer : attribution -->
  <text x="60" y="1172"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1172" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
