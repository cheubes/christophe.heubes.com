<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Principe de Shirky</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Principe formulé par Clay Shirky : les institutions perpétuent le problème auquel elles sont la solution.</dc:description>
    <dc:subject>Management, organisations, sociologie, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- ── Header ── -->
  <text x="60" y="60"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="26" letter-spacing="3"
        fill="#8A9BB0">MANAGEMENT &amp; ORGANISATIONS</text>
  <line x1="60" y1="82" x2="1140" y2="82"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <!-- ── Cercle PROBLÈME (gauche) ── -->
  <circle cx="360" cy="510" r="108"
          fill="#8A9BB0" fill-opacity="0.11"
          stroke="#8A9BB0" stroke-width="2" opacity="0.65"/>
  <text x="360" y="498" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="21" letter-spacing="1"
        fill="#8A9BB0" opacity="0.85">PROBLÈME</text>
  <text x="360" y="526" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="17" letter-spacing="1"
        fill="#8A9BB0" opacity="0.68">persiste</text>

  <!-- ── Cercle INSTITUTION (droite) ── -->
  <circle cx="840" cy="510" r="108"
          fill="#C9A84C" fill-opacity="0.11"
          stroke="#C9A84C" stroke-width="2" opacity="0.78"/>
  <text x="840" y="498" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="21" letter-spacing="1"
        fill="#C9A84C" opacity="0.92">INSTITUTION</text>
  <text x="840" y="526" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="17" letter-spacing="1"
        fill="#C9A84C" opacity="0.72">survit</text>

  <!-- Arc du haut : résolution partielle (INSTITUTION → PROBLÈME) -->
  <path d="M 840,402 C 840,280 360,280 360,402"
        fill="none" stroke="#8A9BB0" stroke-width="2" opacity="0.55"
        stroke-dasharray="6 4"/>
  <polygon points="353,416 367,416 360,402"
           fill="#8A9BB0" opacity="0.55"/>
  <text x="600" y="262" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="18" letter-spacing="1"
        fill="#8A9BB0" opacity="0.72">résout partiellement</text>

  <!-- Arc du bas : perpétuation (PROBLÈME → INSTITUTION) -->
  <path d="M 360,618 C 360,740 840,740 840,618"
        fill="none" stroke="#C9A84C" stroke-width="2" opacity="0.68"/>
  <polygon points="833,604 847,604 840,618"
           fill="#C9A84C" opacity="0.68"/>
  <text x="600" y="762" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="18" letter-spacing="1"
        fill="#C9A84C" opacity="0.80">perpétue pour survivre</text>

  <!-- Symbole infini -->
  <text x="600" y="518" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="28"
        fill="#8A9BB0" opacity="0.45">∞</text>

  <!-- ── Footer ── -->
  <line x1="60" y1="990" x2="1140" y2="990"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <text x="60" y="1062"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="58"
        fill="#C9A84C">Principe de Shirky</text>

  <text x="60" y="1118"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="29"
        fill="#F0EDE4">Les institutions perpétuent le problème auquel elles sont la solution.</text>

  <text x="60" y="1174"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1174" text-anchor="end"
        font-family="'Ubuntu', 'Helvetice Neue', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
