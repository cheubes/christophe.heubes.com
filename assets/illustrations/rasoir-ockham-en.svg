<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 1200 1200" width="1200" height="1200">

  <metadata>
    <dc:title>Occam's Razor</dc:title>
    <dc:creator>Christophe Heubès</dc:creator>
    <dc:rights>CC BY-NC-SA 4.0 — christophe.heubes.com</dc:rights>
    <dc:description>Principle of parsimony attributed to William of Ockham: given equal results, the explanation requiring the fewest assumptions should be preferred.</dc:description>
    <dc:subject>Epistemology, concept, illustration, christophe.heubes.com</dc:subject>
    <dc:date>2026-06-03</dc:date>
  </metadata>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#0D1B2A"/>

  <!-- ── Header ── -->
  <text x="60" y="60"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="26" letter-spacing="3"
        fill="#8A9BB0">EPISTEMOLOGY</text>
  <line x1="60" y1="82" x2="1140" y2="82"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.5"/>

  <!-- ── COMPLEX SCENARIO (y=370) ── -->

  <!-- Label -->
  <text x="575" y="308" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="21" letter-spacing="2"
        fill="#8A9BB0" opacity="0.78">4 HYPOTHESES — COMPLEX</text>

  <!-- Razor dashed line + label -->
  <line x1="350" y1="258" x2="818" y2="444"
        stroke="#C9A84C" stroke-width="2.5" opacity="0.75"
        stroke-dasharray="10 6"/>
  <text x="395" y="248" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="21" letter-spacing="4"
        fill="#C9A84C" opacity="0.95">RAZOR</text>

  <!-- H1 -->
  <circle cx="210" cy="370" r="36"
          fill="#8A9BB0" fill-opacity="0.10" stroke="#8A9BB0"
          stroke-width="2.5" opacity="0.72"/>
  <text x="210" y="378" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="22"
        fill="#8A9BB0" opacity="0.82">H1</text>

  <!-- Arrow H1→H2 -->
  <line x1="248" y1="370" x2="354" y2="370"
        stroke="#8A9BB0" stroke-width="2" opacity="0.55"/>
  <polygon points="354,363 354,377 366,370"
           fill="#8A9BB0" opacity="0.55"/>

  <!-- H2 (eliminated) -->
  <circle cx="400" cy="370" r="36"
          fill="#8A9BB0" fill-opacity="0.07" stroke="#8A9BB0"
          stroke-width="2" opacity="0.55"/>
  <text x="400" y="378" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="22"
        fill="#8A9BB0" opacity="0.55">H2</text>
  <!-- X on H2 -->
  <line x1="377" y1="347" x2="423" y2="393"
        stroke="#8A9BB0" stroke-width="4" opacity="0.72"/>
  <line x1="423" y1="347" x2="377" y2="393"
        stroke="#8A9BB0" stroke-width="4" opacity="0.72"/>

  <!-- Arrow H2→H3 -->
  <line x1="438" y1="370" x2="534" y2="370"
        stroke="#8A9BB0" stroke-width="2" opacity="0.55"/>
  <polygon points="534,363 534,377 546,370"
           fill="#8A9BB0" opacity="0.55"/>

  <!-- H3 (eliminated) -->
  <circle cx="580" cy="370" r="36"
          fill="#8A9BB0" fill-opacity="0.07" stroke="#8A9BB0"
          stroke-width="2" opacity="0.55"/>
  <text x="580" y="378" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="22"
        fill="#8A9BB0" opacity="0.55">H3</text>
  <!-- X on H3 -->
  <line x1="557" y1="347" x2="603" y2="393"
        stroke="#8A9BB0" stroke-width="4" opacity="0.72"/>
  <line x1="603" y1="347" x2="557" y2="393"
        stroke="#8A9BB0" stroke-width="4" opacity="0.72"/>

  <!-- Arrow H3→H4 -->
  <line x1="618" y1="370" x2="714" y2="370"
        stroke="#8A9BB0" stroke-width="2" opacity="0.55"/>
  <polygon points="714,363 714,377 726,370"
           fill="#8A9BB0" opacity="0.55"/>

  <!-- H4 (eliminated) -->
  <circle cx="760" cy="370" r="36"
          fill="#8A9BB0" fill-opacity="0.07" stroke="#8A9BB0"
          stroke-width="2" opacity="0.55"/>
  <text x="760" y="378" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="22"
        fill="#8A9BB0" opacity="0.55">H4</text>
  <!-- X on H4 -->
  <line x1="737" y1="347" x2="783" y2="393"
        stroke="#8A9BB0" stroke-width="4" opacity="0.72"/>
  <line x1="783" y1="347" x2="737" y2="393"
        stroke="#8A9BB0" stroke-width="4" opacity="0.72"/>

  <!-- Arrow H4→FACT (complex) -->
  <line x1="798" y1="370" x2="902" y2="370"
        stroke="#8A9BB0" stroke-width="2" opacity="0.55"/>
  <polygon points="902,363 902,377 914,370"
           fill="#8A9BB0" opacity="0.55"/>

  <!-- FACT (complex) -->
  <circle cx="950" cy="370" r="36"
          fill="#C9A84C" fill-opacity="0.10" stroke="#C9A84C"
          stroke-width="2" opacity="0.72"/>
  <text x="950" y="378" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="20"
        fill="#C9A84C" opacity="0.82">FACT</text>

  <!-- SAME RESULT (between rows) -->
  <text x="950" y="500" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="19" letter-spacing="2"
        fill="#8A9BB0" opacity="0.60">SAME</text>
  <text x="950" y="525" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="19" letter-spacing="2"
        fill="#8A9BB0" opacity="0.60">RESULT</text>

  <!-- ── SIMPLE SCENARIO (y=650) ── -->

  <!-- H₁ -->
  <circle cx="210" cy="650" r="38"
          fill="#C9A84C" fill-opacity="0.13" stroke="#C9A84C"
          stroke-width="3" opacity="0.90"/>
  <text x="210" y="659" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="24"
        fill="#C9A84C" opacity="0.95">H₁</text>

  <!-- Arrow H₁→FACT -->
  <line x1="250" y1="650" x2="898" y2="650"
        stroke="#C9A84C" stroke-width="3.5" opacity="0.85"/>
  <polygon points="898,641 898,659 914,650"
           fill="#C9A84C" opacity="0.85"/>

  <!-- FACT (simple) -->
  <circle cx="950" cy="650" r="38"
          fill="#C9A84C" fill-opacity="0.13" stroke="#C9A84C"
          stroke-width="3" opacity="0.90"/>
  <text x="950" y="659" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="22"
        fill="#C9A84C" opacity="0.95">FACT</text>

  <!-- Label -->
  <text x="575" y="712" text-anchor="middle"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="600" font-size="21" letter-spacing="2"
        fill="#C9A84C" opacity="0.88">1 HYPOTHESIS — SIMPLE — PREFERRED</text>

  <!-- ── Footer ── -->
  <line x1="60" y1="990" x2="1140" y2="990"
        stroke="#8A9BB0" stroke-width="1.5" opacity="0.45"/>

  <text x="60" y="1062"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="58"
        fill="#C9A84C">Occam's Razor</text>

  <text x="60" y="1118"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="29"
        fill="#F0EDE4">Between two equivalent explanations, choose the simpler one.</text>

  <text x="60" y="1174"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="#8A9BB0">christophe.heubes.com</text>
  <text x="1140" y="1174" text-anchor="end"
        font-family="'Ubuntu', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="22"
        fill="#8A9BB0">CC BY-NC-SA 4.0</text>

</svg>
